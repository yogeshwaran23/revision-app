<!DOCTYPE html>
<html lang="en">
<head>

<title>Revision Hub</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f6; --panel:#ffffff; --ink:#14202e; --muted:#5d6b7b; --line:#d9e0e8;
  --accent:#1a8fd1; --accent-soft:#dff1fb; --doubt:#c2410c; --doubt-soft:#fde8dc; --done:#2f7d4f;
  --head:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1620; --panel:#17212d; --ink:#e6edf5; --muted:#94a3b4; --line:#27343f;
    --accent-soft:#12324a; --doubt:#fb923c; --doubt-soft:#3a2314; --done:#5fc58a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1620; --panel:#17212d; --ink:#e6edf5; --muted:#94a3b4; --line:#27343f;
  --accent-soft:#12324a; --doubt:#fb923c; --doubt-soft:#3a2314; --done:#5fc58a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.rail{padding:28px 18px;border-right:1px solid var(--line);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--panel)}
.brand{font-family:var(--head);font-weight:700;font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.dom{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:12px 14px;margin-bottom:6px;cursor:pointer;border-left:5px solid var(--c);transition:background .15s}
.dom:hover{background:var(--bg)}
.dom.on{background:var(--bg);border-color:var(--line);border-left-color:var(--c)}
.dom b{font-family:var(--head);font-size:18px;display:block}
.dom small{color:var(--muted);font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.theme{margin-top:20px;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:14px}
main{padding:32px clamp(16px,4vw,48px) 80px;max-width:980px;width:100%}
h1{font-family:var(--head);font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0 0 6px;border-left:8px solid var(--accent);padding-left:14px}
.stat{color:var(--muted);margin:0 0 22px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.search{flex:1 1 220px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:9px 13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
summary{cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:var(--head);font-weight:500;font-size:18px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--accent);margin-right:10px;transition:transform .15s;display:inline-block}
details[open] summary::before{transform:rotate(90deg)}
summary span.t{flex:1}
summary em{font-style:normal;font-family:var(--body);font-size:13px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0 8px 10px}
li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px}
li:hover{background:var(--bg)}
li label{flex:1;cursor:pointer;display:flex;gap:10px;align-items:center}
li input{accent-color:var(--accent);width:18px;height:18px;flex:none}
li.d .tx{color:var(--muted);text-decoration:line-through}
li.q{background:var(--doubt-soft)}
.flag{border:0;background:none;cursor:pointer;font-size:18px;opacity:.35;padding:2px 6px;border-radius:6px}
li:hover .flag,.flag.on,li.q .flag{opacity:1}
.flag.on{color:var(--doubt)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-family:var(--head);font-size:20px;display:block;margin-bottom:6px}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.editor textarea{width:100%;min-height:260px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;line-height:1.45}
.editor p{margin:0 0 10px;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 12px;display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;align-items:stretch}
  .brand,.sub,.theme{display:none}
  .dom{width:auto;min-width:130px;margin:0;flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const DOMAINS = [
  {id:"snowflake", name:"Snowflake", color:"#1a8fd1", blurb:"Warehouse, SQL, pipelines, governance", raw:SNOWFLAKE},
  {id:"dbt",       name:"dbt",       color:"#e8590c", blurb:"Models, tests, incremental, macros", raw:""},
  {id:"databricks",name:"Databricks",color:"#d6323d", blurb:"Lakehouse, Delta, workflows",       raw:""},
  {id:"pyspark",   name:"PySpark",   color:"#c98a00", blurb:"DataFrames, joins, tuning",         raw:""}
];

/* ---------- storage (safe) ---------- */
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let state  = store.get("rv_state", {});       // {domain: {key: "d"|"q"}}
let custom = store.get("rv_custom", {});      // {domain: rawText}
let ui = { domain: store.get("rv_domain","snowflake"), q:"", filter:"all", editing:false, open:{} };
if(!DOMAINS.some(d=>d.id===ui.domain)) ui.domain = DOMAINS[0].id;

/* ---------- parsing ---------- */
function parse(raw){
  const sections = []; let cur = null;
  (raw||"").split(/\r?\n/).forEach(line=>{
    const t = line.trim(); if(!t) return;
    const h = t.match(/^\d+\.\s+(.+)$/);
    if(h){ cur = {title:h[1].trim(), topics:[]}; sections.push(cur); return; }
    const topic = t.replace(/^\[[ xX]?\]\s*/, "").replace(/^[-*•]\s+/, "").trim();
    if(!topic) return;
    if(!cur){ cur = {title:"Topics", topics:[]}; sections.push(cur); }
    cur.topics.push(topic);
  });
  return sections;
}
const rawFor = d => (custom[d.id] !== undefined ? custom[d.id] : d.raw);
const keyOf = (sec, topic) => sec + "||" + topic;
const getSt = (d, k) => (state[d] && state[d][k]) || "";
function setSt(d, k, v){
  state[d] = state[d] || {};
  if(v) state[d][k] = v; else delete state[d][k];
  store.set("rv_state", state);
}
function counts(d){
  const secs = parse(rawFor(d)); let total=0, done=0, doubt=0;
  secs.forEach(s=>s.topics.forEach(t=>{ total++; const v=getSt(d.id,keyOf(s.title,t)); if(v==="d")done++; if(v==="q")doubt++; }));
  return {total, done, doubt};
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderRail(){
  $("rail").innerHTML = '<p class="brand">Revision Hub</p><p class="sub">Pick a domain, revise, flag doubts.</p>' +
    DOMAINS.map(d=>{
      const c = counts(d), pct = c.total ? Math.round(c.done/c.total*100) : 0;
      return `<button class="dom ${d.id===ui.domain?"on":""}" style="--c:${d.color}" data-id="${d.id}">
        <b>${d.name}</b><small>${c.total ? c.done+" / "+c.total+" revised" : "No topics yet"}</small>
        <div class="bar"><i style="width:${pct}%"></i></div></button>`;
    }).join("") + '<button class="theme" id="themeBtn">Toggle theme</button>';
  $("rail").querySelectorAll(".dom").forEach(b=>b.onclick=()=>{
    ui.domain=b.dataset.id; ui.q=""; ui.filter="all"; ui.editing=false; store.set("rv_domain",ui.domain); render();
  });
  $("themeBtn").onclick=()=>{
    const root=document.documentElement;
    const dark = root.dataset.theme==="dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    root.dataset.theme = dark ? "light" : "dark";
  };
}

function renderMain(){
  const d = DOMAINS.find(x=>x.id===ui.domain);
  document.documentElement.style.setProperty("--accent", d.color);
  document.documentElement.style.setProperty("--accent-soft", d.color+"22");
  document.title = d.name + " · Revision Hub";
  const secs = parse(rawFor(d)), c = counts(d);
  let h = `<h1>${d.name}</h1><p class="stat">${c.total} topics · ${c.done} revised · ${c.doubt} flagged as doubt</p>`;

  if(ui.editing || !c.total){
    h += `<div class="editor"><p>${c.total ? "Edit the list." : "No topics for "+d.name+" yet."} Paste your topics here. A line like <b>1. Section name</b> starts a section, every other line is a topic.</p>
      <textarea id="ta" spellcheck="false" placeholder="1. Fundamentals&#10;What is ${esc(d.name)}?&#10;Key features and use cases&#10;&#10;2. Core concepts&#10;...">${esc(rawFor(d))}</textarea>
      <div class="row"><button class="btn pri" id="saveBtn">Save topics</button>
      ${c.total ? '<button class="btn" id="cancelBtn">Cancel</button>' : ""}
      ${d.raw ? '<button class="btn" id="resetBtn">Restore original</button>' : ""}</div></div>`;
  }
  if(c.total && !ui.editing){
    h += `<div class="tools"><input class="search" id="search" type="search" placeholder="Search ${d.name} topics" value="${esc(ui.q)}" aria-label="Search topics">
      <div class="seg" role="group" aria-label="Filter">${[["all","All"],["todo","To revise"],["q","Doubts"],["d","Done"]].map(f=>`<button data-f="${f[0]}" class="${ui.filter===f[0]?"on":""}">${f[1]}</button>`).join("")}</div>
      <button class="btn" id="toggleAll">Expand / collapse</button>
      <button class="btn" id="editBtn">Edit topics</button></div><div id="list"></div>`;
  }
  $("main").innerHTML = h;
  if(c.total && !ui.editing) renderList(d, secs);
  wire(d);
}

function renderList(d, secs){
  const q = ui.q.trim().toLowerCase();
  let html = "", shown = 0;
  secs.forEach((s,i)=>{
    const items = s.topics.filter(t=>{
      const v = getSt(d.id,keyOf(s.title,t));
      if(q && !t.toLowerCase().includes(q) && !s.title.toLowerCase().includes(q)) return false;
      if(ui.filter==="todo") return v!=="d";
      if(ui.filter==="q") return v==="q";
      if(ui.filter==="d") return v==="d";
      return true;
    });
    if(!items.length) return;
    shown += items.length;
    const doneN = s.topics.filter(t=>getSt(d.id,keyOf(s.title,t))==="d").length;
    const open = (q || ui.filter!=="all" || ui.open[d.id+i]) ? "open" : "";
    html += `<details ${open} data-i="${i}"><summary><span class="t">${esc(s.title)}</span><em>${doneN}/${s.topics.length}</em></summary><ul>` +
      items.map(t=>{
        const k = keyOf(s.title,t), v = getSt(d.id,k);
        return `<li class="${v}"><label><input type="checkbox" data-k="${esc(k)}" ${v==="d"?"checked":""}><span class="tx">${esc(t)}</span></label>
          <button class="flag ${v==="q"?"on":""}" data-k="${esc(k)}" title="Mark as doubt" aria-label="Mark as doubt" aria-pressed="${v==="q"}">⚑</button></li>`;
      }).join("") + `</ul></details>`;
  });
  $("list").innerHTML = shown ? html : `<div class="empty"><b>Nothing here</b>No topics match this search or filter.</div>`;
  $("list").querySelectorAll("details").forEach(el=>el.addEventListener("toggle",()=>{ ui.open[d.id+el.dataset.i]=el.open; }));
  $("list").querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.onchange=()=>{
    setSt(d.id, cb.dataset.k, cb.checked ? "d" : ""); refresh(d);
  });
  $("list").querySelectorAll(".flag").forEach(b=>b.onclick=()=>{
    setSt(d.id, b.dataset.k, getSt(d.id,b.dataset.k)==="q" ? "" : "q"); refresh(d);
  });
}

function refresh(d){ // keep scroll + search focus while updating
  const y = window.scrollY; renderRail(); renderMain(); window.scrollTo(0,y);
}

function wire(d){
  const s = $("search");
  if(s) s.oninput = e => { ui.q = e.target.value; renderList(d, parse(rawFor(d))); };
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ ui.filter=b.dataset.f; renderMain(); });
  const ta = $("toggleAll");
  if(ta) ta.onclick = () => {
    const ds = document.querySelectorAll("#list details");
    const anyClosed = [...ds].some(x=>!x.open);
    ds.forEach(x=>{ x.open = anyClosed; });
  };
  const eb = $("editBtn"); if(eb) eb.onclick = () => { ui.editing = true; renderMain(); };
  const cb = $("cancelBtn"); if(cb) cb.onclick = () => { ui.editing = false; renderMain(); };
  const sb = $("saveBtn"); if(sb) sb.onclick = () => {
    custom[d.id] = $("ta").value; store.set("rv_custom", custom); ui.editing=false; renderRail(); renderMain();
  };
  const rb = $("resetBtn"); if(rb) rb.onclick = () => {
    delete custom[d.id]; store.set("rv_custom", custom); ui.editing=false; renderRail(); renderMain();
  };
}

function render(){ renderRail(); renderMain(); }
render();
</script>
</body>
</html>
